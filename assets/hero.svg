<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Merhaba, ben future01 — İSG yazılımları, web uygulamaları ve yapay zekâ araçları.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121a"/>
      <stop offset="0.6" stop-color="#0a1a24"/>
      <stop offset="1" stop-color="#061017"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#14e0c4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14e0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14e0c4"/>
      <stop offset="1" stop-color="#3b9eff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14e0c4" stop-opacity="0"/>
      <stop offset="1" stop-color="#14e0c4" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14e0c4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <filter id="glow01" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14e0c4"/><stop offset="1" stop-color="#3b9eff"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .blink{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .spin{transform-origin:960px 190px;animation:spin 4s linear infinite}
    .spinr{transform-origin:960px 190px;animation:spin 18s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ping{transform-origin:center;transform-box:fill-box;animation:ping 4s ease-out infinite}
    .ping2{animation-delay:1.7s}
    @keyframes ping{0%,70%{opacity:0}75%{opacity:1}100%{opacity:.15}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#14e0c4" stroke-opacity="0.18"/>

